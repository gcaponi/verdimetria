# Canonical nginx vhost for the Verdimetria API on pcc.
# Install as /etc/nginx/sites-available/verdimetria-api and keep exactly one
# symlink in sites-enabled. Backup copies must live outside sites-enabled,
# because nginx loads every regular file matched by that directory's glob.

server {
    server_name api.verdimetria.cais.uno;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /static/ {
        alias /opt/verdimetria/staticfiles/;
    }

    # Contains the private location and server-only signing secret used for
    # short-lived disaster-recovery downloads. Never commit the real snippet.
    include /etc/nginx/snippets/verdimetria-secure-download.conf;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.verdimetria.cais.uno/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.verdimetria.cais.uno/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.verdimetria.cais.uno) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.verdimetria.cais.uno;
    return 404; # managed by Certbot
}
